server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${API_UPSTREAM};

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_ssl_server_name on;

        # Rewrite any redirect Location headers from the API back to the
        # frontend origin so the browser never follows them directly to the
        # API URL (which would be cross-origin and break CORS).
        proxy_redirect ${API_UPSTREAM} /;
    }

    location /hubs/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_ssl_server_name on;

        proxy_redirect ${API_UPSTREAM} /;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
