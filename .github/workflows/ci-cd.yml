name: CI and CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: test-and-build
  # Runs on every push and pull request to main.
  # ---------------------------------------------------------------------------
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    # -------------------------------------------------------------------------
    # PostgreSQL service container
    # Credentials match TestDatabase.ConnectionString in the test project so
    # that dotnet test can reach localhost:5432 with no extra configuration.
    # -------------------------------------------------------------------------
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: document_processing_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d document_processing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # .NET – restore, test, build
      # Restoring the test project is sufficient: it pulls in the API project
      # via <ProjectReference>, so no solution file is needed.
      # -----------------------------------------------------------------------
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore DocumentProcessing.Api.Tests/DocumentProcessing.Api.Tests.csproj

      - name: Run .NET tests
        run: >-
          dotnet test DocumentProcessing.Api.Tests/DocumentProcessing.Api.Tests.csproj
          --configuration Release
          --no-restore

      - name: Build .NET API
        run: >-
          dotnet build DocumentProcessing.Api/DocumentProcessing.Api.csproj
          --configuration Release
          --no-restore

      # -----------------------------------------------------------------------
      # React frontend – install and build
      # -----------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      # -----------------------------------------------------------------------
      # Docker image validation
      # These images are throwaway CI artifacts — they are never pushed to a
      # registry. Render builds its own images when the deploy hooks fire.
      # -----------------------------------------------------------------------
      - name: Build frontend Docker image
        run: docker build -t document-processing-client:ci ./client

      - name: Build API Docker image
        run: docker build -t document-processing-api:ci ./DocumentProcessing.Api

  # ---------------------------------------------------------------------------
  # Job 2: deploy
  # Only runs after test-and-build passes, and only for pushes to main (not
  # for pull requests).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # Trigger Render to deploy the exact commit that was tested.
      # The hook URLs are stored as GitHub repository secrets so they are
      # never exposed in logs or source code.
      # Setup: GitHub repo → Settings → Secrets and variables → Actions
      #   RENDER_API_DEPLOY_HOOK_URL    – from Render API service → Settings → Deploy Hook
      #   RENDER_CLIENT_DEPLOY_HOOK_URL – from Render frontend service → Settings → Deploy Hook
      # Also disable "Auto-Deploy" in each Render service so that Render does
      # not deploy independently on every Git push.

      - name: Deploy API to Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_API_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Missing RENDER_API_DEPLOY_HOOK_URL secret. Add it at: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "${DEPLOY_URL}&ref=${COMMIT_SHA}"

      - name: Deploy frontend to Render
        env:
          DEPLOY_URL: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::Missing RENDER_CLIENT_DEPLOY_HOOK_URL secret. Add it at: GitHub repo → Settings → Secrets and variables → Actions"
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "${DEPLOY_URL}&ref=${COMMIT_SHA}"
