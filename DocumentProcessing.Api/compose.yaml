services:

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: document-processing-api:local
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Worker__Enabled: "true"
      Database__MigrateOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Supabase__Url: ${SUPABASE_URL}
      Supabase__Bucket: ${SUPABASE_BUCKET}
      Supabase__SecretKey: ${SUPABASE_SECRET_KEY}
      Jwt__Secret: ${JWT_SECRET}
    ports:
      - "5116:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/database > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  db:
    image: postgres:17-alpine
    container_name: document-processing-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  postgres_data: